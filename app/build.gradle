plugins { id 'com.android.application' }

android {
    namespace 'com.dna.tools'
    compileSdk 34

    defaultConfig {
        applicationId 'com.dna.tools'   // jangan diubah: script lama hardcode /data/user/0/com.dna.tools
        minSdk 21
        targetSdk 28                    // harus <29 supaya binary di filesDir boleh dieksekusi
        versionCode 20261024
        versionName '9.1.0-lite'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
