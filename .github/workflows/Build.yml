name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache Gradle (dependency, distribusi, build cache) ditangani action ini
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false   # semua branch boleh nulis cache, bukan cuma main

      # Cache tambahan untuk output kompilasi AGP
      - uses: actions/cache@v4
        with:
          path: |
            app/build/intermediates
            app/build/tmp
          key: agp-${{ runner.os }}-${{ hashFiles('app/build.gradle', 'build.gradle', 'settings.gradle', 'gradle.properties') }}-${{ hashFiles('app/src/main/java/**') }}
          restore-keys: |
            agp-${{ runner.os }}-${{ hashFiles('app/build.gradle', 'build.gradle', 'settings.gradle', 'gradle.properties') }}-
            agp-${{ runner.os }}-

      # Opsional: kalau secret keystore diisi, APK ditandatangani key tetap.
      # Kalau tidak, dipakai debug key (ganti tiap build, update harus uninstall dulu).
      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --build-cache --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/release/*.apk DNA-Lite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DNA-Lite
          path: DNA-Lite.apk

      - name: Publish release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DNA-Lite.apk
