name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Cache Gradle (dependency, distribusi, build cache) ditangani action ini
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false   # semua branch boleh nulis cache, bukan cuma main

      # Cache tambahan untuk output kompilasi AGP
      - uses: actions/cache@v4
        with:
          path: |
            app/build/intermediates
            app/build/tmp
          key: agp-${{ runner.os }}-${{ hashFiles('app/build.gradle', 'build.gradle', 'settings.gradle', 'gradle.properties') }}-${{ hashFiles('app/src/main/java/**') }}
          restore-keys: |
            agp-${{ runner.os }}-${{ hashFiles('app/build.gradle', 'build.gradle', 'settings.gradle', 'gradle.properties') }}-
            agp-${{ runner.os }}-

      # Opsional: kalau secret keystore diisi, APK ditandatangani key tetap.
      # Kalau tidak, dipakai debug key (ganti tiap build, update harus uninstall dulu).
      - name: Siapkan keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --build-cache --stacktrace

      - name: Rename APK
        run: mv app/build/outputs/apk/release/*.apk DNA-Lite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DNA-Lite
          path: DNA-Lite.apk

      - name: Kirim APK ke Telegram channel
        if: success() && github.event_name != 'pull_request'
        continue-on-error: true
        env:
          TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "TELEGRAM_TOKEN / TELEGRAM_CHAT_ID belum diisi, lewati."
            exit 0
          fi
          VER=$(grep -m1 "versionName" app/build.gradle | sed "s/.*versionName *['\"]\([^'\"]*\)['\"].*/\1/")
          SHA=$(echo "$GITHUB_SHA" | cut -c1-7)
          CAPTION=$(printf 'DNA Lite %s\nCommit: %s %s\nBuild: %s' "$VER" "$SHA" "$(echo "$COMMIT_MSG" | head -n1)" "$RUN_URL")
          curl -sS --fail-with-body -X POST "https://api.telegram.org/bot${TOKEN}/sendDocument" \
            --form-string "chat_id=${CHAT_ID}" \
            -F "document=@DNA-Lite.apk;filename=DNA-Lite-${VER}.apk" \
            --form-string "caption=${CAPTION}"

      - name: Publish release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DNA-Lite.apk
